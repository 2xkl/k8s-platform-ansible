---
- name: Install External Secrets Operator
  hosts: localhost
  gather_facts: false
  vars:
    eso_namespace: external-secrets
    eso_helm_repo: "https://charts.external-secrets.io"
    eso_chart_version: ""  # latest

  tasks:
    - name: Check if Helm is installed
      ansible.builtin.command: helm version --short
      register: helm_version
      changed_when: false
      failed_when: helm_version.rc != 0

    - name: Add External Secrets Helm repo
      ansible.builtin.command: helm repo add external-secrets {{ eso_helm_repo }}
      register: helm_repo_add
      changed_when: "'has been added' in helm_repo_add.stdout"
      failed_when:
        - helm_repo_add.rc != 0
        - "'already exists' not in helm_repo_add.stderr"

    - name: Update Helm repos
      ansible.builtin.command: helm repo update
      register: helm_update
      changed_when: false

    - name: Check if ESO is already installed
      ansible.builtin.command: >
        helm status external-secrets -n {{ eso_namespace }}
      register: eso_status
      changed_when: false
      failed_when: false

    - name: Install External Secrets Operator via Helm
      ansible.builtin.command: >
        helm install external-secrets external-secrets/external-secrets
        -n {{ eso_namespace }}
        --create-namespace
        --set installCRDs=true
        --wait
        --timeout 300s
      when: eso_status.rc != 0
      register: eso_install
      changed_when: eso_install.rc == 0

    - name: Wait for ESO controller to be ready
      ansible.builtin.command: >
        kubectl rollout status deployment/external-secrets
        -n {{ eso_namespace }}
        --timeout=300s
      register: eso_rollout
      changed_when: false

    - name: Wait for ESO webhook to be ready
      ansible.builtin.command: >
        kubectl rollout status deployment/external-secrets-webhook
        -n {{ eso_namespace }}
        --timeout=300s
      register: webhook_rollout
      changed_when: false

    - name: Wait for ESO cert-controller to be ready
      ansible.builtin.command: >
        kubectl rollout status deployment/external-secrets-cert-controller
        -n {{ eso_namespace }}
        --timeout=300s
      register: cert_rollout
      changed_when: false

    - name: Display ESO pods status
      ansible.builtin.command: kubectl get pods -n {{ eso_namespace }}
      register: eso_pods
      changed_when: false

    - name: Show ESO pods
      ansible.builtin.debug:
        var: eso_pods.stdout_lines
