---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: demo-app
  labels:
    app: demo-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-api
  template:
    metadata:
      labels:
        app: demo-api
    spec:
      containers:
        - name: demo-api
          image: demo-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: Keycloak__Authority
              value: "http://keycloak.keycloak.svc.cluster.local:8080/realms/demo"
            - name: Kafka__BootstrapServers
              value: "demo-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api
  namespace: demo-app
  labels:
    app: demo-api
spec:
  type: NodePort
  selector:
    app: demo-api
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
      protocol: TCP
