---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-secret-app
  namespace: demo-app
  labels:
    app: nginx-secret-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-secret-app
  template:
    metadata:
      labels:
        app: nginx-secret-app
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          env:
            - name: SECRET_USERNAME
              valueFrom:
                secretKeyRef:
                  name: myapp-secret
                  key: username
            - name: SECRET_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: myapp-secret
                  key: password
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
