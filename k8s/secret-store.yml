---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-secret-store
  namespace: demo-app
spec:
  provider:
    vault:
      server: "http://192.168.49.1:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-role"
          serviceAccountRef:
            name: "eso-vault-auth"
          secretRef:
            name: "eso-vault-auth-token"
            key: "token"
