---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-secret-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/2xkl/k8s-platform-ansible.git"
    targetRevision: feature/eso-vault-argocd
    path: k8s
    directory:
      recurse: true
  destination:
    server: "https://kubernetes.default.svc"
    namespace: demo-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
